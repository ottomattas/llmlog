name: openai_gpt-5.2__think-none__prompt-matrix
description: >
  Full prompt-variant matrix for OpenAI gpt-5.2-2025-12-11 with thinking_mode=think_none.
  Mirrors the gpt-5.2-pro think_high prompt matrix, but swaps the target to the low/no-reasoning baseline.

runs_dir: runs

# Standard coarse sweep selection (vars 10/20/30/40/50; len 3/4/5; case_limit=10).
maxvars: "10,20,30,40,50"
lens: [3, 4, 5]
case_limit: 10

suites:
  # Horn-only
  - path: configs/suites/sat__repr-cnf_compact__subset-hornonly__prompt-examples_only__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-cnf_compact__subset-hornonly__prompt-horn_alg_linear__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-cnf_compact__subset-hornonly__prompt-horn_alg_from__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-cnf_nl__subset-hornonly__prompt-examples_only__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-cnf_nl__subset-hornonly__prompt-horn_alg_linear__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-cnf_nl__subset-hornonly__prompt-horn_alg_from__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-horn_if_then__subset-hornonly__prompt-examples_only__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-horn_if_then__subset-hornonly__prompt-horn_alg_linear__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-horn_if_then__subset-hornonly__prompt-horn_alg_from__openai_gpt-5.2__think-none.yaml

  # Non-Horn-only
  - path: configs/suites/sat__repr-cnf_compact__subset-nonhornonly__prompt-examples_only__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-cnf_compact__subset-nonhornonly__prompt-dpll_alg_linear__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-cnf_compact__subset-nonhornonly__prompt-dpll_alg_from__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-cnf_nl__subset-nonhornonly__prompt-examples_only__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-cnf_nl__subset-nonhornonly__prompt-dpll_alg_linear__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-cnf_nl__subset-nonhornonly__prompt-dpll_alg_from__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-horn_if_then__subset-nonhornonly__prompt-examples_only__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-horn_if_then__subset-nonhornonly__prompt-horn_alg_linear__openai_gpt-5.2__think-none.yaml
  - path: configs/suites/sat__repr-horn_if_then__subset-nonhornonly__prompt-horn_alg_from__openai_gpt-5.2__think-none.yaml

