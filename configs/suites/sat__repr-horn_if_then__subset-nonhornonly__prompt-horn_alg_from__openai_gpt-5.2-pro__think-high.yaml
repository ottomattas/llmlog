name: sat__repr-horn_if_then__subset-nonhornonly__prompt-horn_alg_from__openai_gpt-5.2-pro__think-high
description: "Non-Horn-only subset. Horn if-then (facts + rules) rendering as a representation-mismatch negative control. Horn forward chaining (with provenance) prompt. OpenAI gpt-5.2-pro with thinking=high."

task: sat_decision
subset: nonhornonly

dataset:
  path: datasets/validation/full_vars3-50_len3-5_hornmixed_per50_seed12345.jsonl
  skip_rows: 1

prompting:
  render_policy: fixed
  representation: horn_if_then
  template: prompts/sat_decision__horn_if_then__horn_alg_from.j2
  prompt_profile: direct
  response_style: answer_only
  answer_format: yes_no

targets_ref:
  - ../targets/openai_gpt-5.2-pro__think-high.yaml

pricing_table: configs/pricing/openai_2025-12-18.yaml

output_pattern: runs/${name}/${run}/${provider}/${model}/${thinking_mode}/results.jsonl
resume: true

