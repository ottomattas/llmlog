name: sat__repr-cnf_compact__subset-nonhornonly__prompt-dpll_alg_linear__openai_gpt-5.2__think-none
description: "Non-Horn-only subset. Compact CNF representation. DPLL algorithm prompt (linear trace). OpenAI gpt-5.2 with reasoning effort=none (compute baseline)."

task: sat_decision
subset: nonhornonly

dataset:
  path: datasets/validation/full_vars3-50_len3-5_hornmixed_per50_seed12345.jsonl
  skip_rows: 1

prompting:
  render_policy: fixed
  representation: cnf_compact
  template: prompts/sat_decision__cnf_compact__dpll_alg_linear.j2
  prompt_profile: direct
  response_style: answer_only
  answer_format: contradiction_satisfiable

targets_ref:
  - ../targets/openai_gpt-5.2__think-none.yaml

pricing_table: configs/pricing/openai_2025-12-18.yaml

output_pattern: runs/${name}/${run}/${provider}/${model}/${thinking_mode}/results.jsonl
resume: true


