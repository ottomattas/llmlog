name: google_gemini-3-pro-preview__think-none

# Legacy baseline for Gemini 3 Pro where we omit explicit thinking configuration.
#
# Note: Gemini 3 models have an internal thinking process; omitting thinking config does NOT mean
# "no thinking". For explicit control, prefer the level-based targets:
# - google_gemini-3-pro-preview__think-low.yaml
# - google_gemini-3-pro-preview__think-high.yaml
# - google_gemini-3-flash-preview__think-minimal.yaml
targets:
  - provider: google
    model: gemini-3-pro-preview
    temperature: 0
    seed: 1234
    max_tokens: 30000
    thinking:
      enabled: false

