name: openai_gpt-5.2-pro__compute_baseline
description: >
  Minimal compute ablation set for the paper: same OpenAI model family with thinking on vs off.
  This matrix is meant to highlight what needs to be run to support RQ3 (test-time compute + cost).

runs_dir: runs

maxvars: "10,20,30,40,50"
lens: [3, 4, 5]
case_limit: 10

suites:
  # Thinking=high (already partially run)
  - path: configs/suites/sat__repr-cnf_compact__subset-hornonly__prompt-examples_only__openai_gpt-5.2-pro__think-high.yaml
  - path: configs/suites/sat__repr-cnf_compact__subset-hornonly__prompt-horn_alg_linear__openai_gpt-5.2-pro__think-high.yaml
  - path: configs/suites/sat__repr-cnf_compact__subset-nonhornonly__prompt-dpll_alg_linear__openai_gpt-5.2-pro__think-high.yaml

  # Thinking disabled (missing)
  - path: configs/suites/sat__repr-cnf_compact__subset-hornonly__prompt-examples_only__openai_gpt-5.2-pro__nothink.yaml
  - path: configs/suites/sat__repr-cnf_compact__subset-hornonly__prompt-horn_alg_linear__openai_gpt-5.2-pro__nothink.yaml
  - path: configs/suites/sat__repr-cnf_compact__subset-nonhornonly__prompt-dpll_alg_linear__openai_gpt-5.2-pro__nothink.yaml


