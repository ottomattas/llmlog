# Run-selection policy for paper figure generation.
#
# This controls which `run` folders under `_refactor/runs/<suite>/<run>/...` are used when
# multiple runs exist for the same suite cell.
#
# NOTE: The selection outcome is always reported in:
# - reports/paper_figures/paper_figures.selection.md
# - reports/paper_figures/paper_figures.selection.json

default:
  # Prefer the newest run that has usable data (answered+unclear > 0 under `accuracy_mode=completed`).
  strategy: newest_with_data

targets:
  # Pin Gemini to the explicit rerun to avoid mixing older (possibly partial/buggy) runs.
  - match:
      provider: google
      model: "gemini-*"
    use_only_run_substr: "rerun_20260119"

